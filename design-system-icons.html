<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Unipost Icons Library</title>
    <style>
        :root {
            --primary-blue: #0046FF;
            --search-border-color: #ccc;
            --border-color: #f5f5f5;
            --text-main: #111;
            --text-sub: #888;
        }
        body {
            margin: 0; 
            font-family: 'Pretendard', sans-serif; 
            color: var(--text-main);
            background: #FFF; 
        }

        /* 검색바 */
        .search-container {
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            padding: 80px 0 50px;
            backdrop-filter: blur(20px);
            z-index: 100;
        }
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 15px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: 2px solid var(--search-border-color);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 10px 20px rgba(0,70,255,0.1);
        }
        .container {
            max-width: 1400px; 
            padding: 0 40px 60px;
            margin: 0 auto; 
        }

        /* 대분류 */
        .main-card {
            overflow: hidden;
            margin-bottom: 50px;
            padding-bottom: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 60px rgba(0,0,0,.06);
            transition: opacity 0.3s ease;
        }
        /* 검색 결과 없을 때 카드 숨김 */
        .main-card.hidden {display: none;}
        .main-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 20px 32px;
            font-weight: 800;
            font-size: 1.5rem;
            color: #000;
            border-bottom: 1px solid var(--border-color);
        }
        .main-header::before {
            content: '';
            width: 4px;
            height: 20px;
            border-radius: 4px;
            background: var(--primary-blue);
        }

        /* 소분류 */
        .sub-row {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px 32px;
            transition: opacity 0.3s ease;
        }
        .sub-row.hidden {display: none;}
        @media (max-width: 1400px) {
            .sub-row {flex-direction: column;}
        }
        .sub-info {
            flex-grow: 1;
            min-width: 120px;
            text-align: right;
        }
        .sub-info h2 {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 8px 0;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-main);
        }
        .sub-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            font-size: 0.85rem;
            color: var(--primary-blue);
            border-radius: 24px;
            background-color: rgb(0 70 255 / 8%);
            box-sizing: border-box;
        }

        /* 아이콘 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 120px);
            flex-shrink: 0;
            gap: 20px; 
            width: 100%;
            max-width: 1100px;
        }
        .icon-item {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 120px;
            height: 120px;
            margin: 0;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* 검색 활성 */
        .icon-item.highlight {
            border-width: 2px;
            border-color: var(--primary-blue);
            background: rgba(0,70,255,0.02);
        }
        .icon-item:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 6px 15px rgba(0,70,255,0.1);
            transform: translateY(-2px);
        }
        .icon-img-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 30px;
            max-height: 30px;
            margin: 0 auto;
        }
        .icon-img-box img {
            max-width: 100%;
            height: 100%;
        }
        .icon-name {
            overflow: hidden;
            position: relative;
            top: 20px;
            width: 100%;
            padding: 0 10px;
            text-align: center;
            text-overflow: ellipsis;
            word-wrap: break-word;
            white-space: nowrap;
            font-size: 0.75rem;
            color: var(--text-sub);
            box-sizing: border-box;
        }

        /* 검색 비활성 */
        .icon-item.dimmed {
            /* 투명도 */
            /* opacity: 0.1;
            filter: grayscale(1);
            pointer-events: none; */

            /* 숨기기 */
            display: none;
        }

        /* 토스트 메시지 */
        #toast {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 50%;
            padding: 14px 32px;
            font-weight: 700;
            color: #fff;
            border-radius: 50px;
            background: var(--primary-blue);
            box-shadow: 0 10px 25px rgba(0,70,255,0.3);
            z-index: 1000;
            transform: translateX(-50%);
        }
    </style>
</head>

const ICON_PATH = "./icon/"; 

function render() {
    const root = document.getElementById('lib-root');
    let html = "";

    iconConfig.forEach(cat => {
        html += `<div class="main-card">
            <div class="main-header">${cat.main}</div>`;
        
        cat.subs.forEach(sub => {
            html += `<div class="sub-row">
                <div class="sub-info">
                    <h2>${sub.name}<span class="sub-count">${sub.icons.length}</span></h2>
                </div>
                <div class="grid">`;
                
                sub.icons.forEach(iconObj => {
                    html += `
                        <div class="icon-item" 
                             data-name="${iconObj.file.toLowerCase()}" 
                             data-keywords="${iconObj.kw.toLowerCase()}"
                             onclick="copyImage('${ICON_PATH}${iconObj.file}')">
                            <div class="icon-img-box"><img src="${ICON_PATH}${iconObj.file}" alt="${iconObj.file}"></div>
                            <div class="icon-name">${iconObj.file}</div>
                        </div>`;
                });

            html += `</div></div>`;
        });
        html += `</div>`;
    });
    root.innerHTML = html;
    
    initSearch();
}

// 검색
function initSearch() {
    const searchInput = document.getElementById('iconSearch');
    const cards = document.querySelectorAll('.main-card');
    const rows = document.querySelectorAll('.sub-row');
    const items = document.querySelectorAll('.icon-item');

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        
        if (val === "") {
            // 검색어가 없으면 모두 초기화
            items.forEach(el => el.classList.remove('dimmed', 'highlight'));
            rows.forEach(el => el.classList.remove('hidden'));
            cards.forEach(el => el.classList.remove('hidden'));
            return;
        }

        items.forEach(item => {
            const name = item.getAttribute('data-name');
            const keywords = item.getAttribute('data-keywords');
            
            if (name.includes(val) || keywords.includes(val)) {
                item.classList.remove('dimmed');
                item.classList.add('highlight');
            } else {
                item.classList.add('dimmed');
                item.classList.remove('highlight');
            }
        });

        // 비어있는 섹션 처리 (선택사항: 검색 결과가 없는 줄이나 카드를 숨기고 싶으면 활성화)
        rows.forEach(row => {
            const visibleItems = row.querySelectorAll('.icon-item:not(.dimmed)');
            if (visibleItems.length === 0) row.classList.add('hidden');
            else row.classList.remove('hidden');
        });

        cards.forEach(card => {
            const visibleRows = card.querySelectorAll('.sub-row:not(.hidden)');
            if (visibleRows.length === 0) card.classList.add('hidden');
            else card.classList.remove('hidden');
        });
    });
}

async function copyImage(url) {
    try {
        const response = await fetch(url);
        const blob = await response.blob();
        
        const img = new Image();
        const svgUrl = URL.createObjectURL(blob);
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const targetWidth = 600;
            const scaleFactor = targetWidth / img.width;
            const targetHeight = img.height * scaleFactor;
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
            canvas.toBlob(pngBlob => {
                const item = new ClipboardItem({ "image/png": pngBlob });
                navigator.clipboard.write([item]);
                showToast();
                URL.revokeObjectURL(svgUrl);
            }, 'image/png');
        };
        img.src = svgUrl;
    } catch (e) {
        console.error(e);
        alert("복사 실패! 서버(http) 환경에서 확인해 주세요.");
    }
}

function showToast() {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}
